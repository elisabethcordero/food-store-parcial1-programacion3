<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Food Store</title>
</head>
<body>
    <div class="logo-centrado">
        <span class="logo-icono">🍽️</span>
        <p>Food Store</p>
    </div>

    <div class="pagina-centrada">
        <h1>Crear cuenta</h1>

        <form id="form" class="form-card">
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="off" placeholder="ejemplo@mail.com">
            </div>
            <div>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="off" placeholder="********">
            </div>

            <button type="submit">Registrarme</button>
        </form>

        <p>¿Ya tenés cuenta? <a href="../login/login.html">Iniciar sesión</a></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="./registro.ts"></script>
</body>
</html>
